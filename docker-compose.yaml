version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=shopdb;Username=shopuser;Password=yourpassword
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop-net

  db:
    image: postgres:16-alpine
    container_name: shop-db
    environment:
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shop-net

volumes:
  pgdata:

networks:
  shop-net:
    driver: bridge
